classifier:
  # pytorch_model.bin is downloaded from Google Drive (see scripts/download_classifier.py);
  # the rest of this directory is committed.
  model_dir: models/real_training/classifier_bert_base
generator:
  checkpoint: models/real_training/music_transformer_fulldata/best.pt
  tokenizer: models/real_training/music_transformer_fulldata/tokenizer/vocab.json
probes:
  # MIDI-to-quadrant probes for the frontend round-trip panel. The app starts with the panel
  # disabled when this directory is absent, so generation never depends on it.
  directory: models/real_training/music_probe
output:
  sample_dir: artifacts/samples
generation:
  max_tokens: 512
  temperature: 1.0
  top_k: 32
  guidance_scale: 3.0
